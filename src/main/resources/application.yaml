spring:
  application:
    name: traveller-service
  datasource:
    # Default to an in-memory H2 database. Override with DB_URL to point to another DB if needed.
    url: ${DB_URL:jdbc:h2:mem:travellerdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

# Springdoc (Swagger) UI will be available at /swagger-ui.html or /swagger-ui/index.html
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
