spring:
  application:
    name: traveller-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
  s3:
    bucket: ${S3_BUCKET:travolish-bucket}
    region: ${AWS_REGION:us-east-1}
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@travolish.com}
    from-name: ${MAIL_FROM_NAME:Travolish Hotels}
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: notification-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s

# Google Cloud Storage
gcs:
  bucket-name: ${GCS_BUCKET_NAME:travolish-avatars}

# Supabase Storage (database + file storage — auth handled by Google directly)
supabase:
  url: ${SUPABASE_URL}
  api-key: ${SUPABASE_API_KEY}
  bucket-name: ${SUPABASE_BUCKET_NAME:travolish-bucket}

# Google OAuth2
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID}
    verify-signature: ${GOOGLE_VERIFY_SIGNATURE:true}

# JWT — tokens issued by this service after Google sign-in
jwt:
  secret: ${JWT_SECRET:travolish-secret-key-for-oauth2-authentication-tokens-please-change-in-production}
  expiration: 3600000
  refresh:
    expiration: 604800000

# Apple OAuth configuration
apple:
  client-id: ${APPLE_CLIENT_ID:com.travolish.app}
  team-id: ${APPLE_TEAM_ID:ABCD123456}
  key-id: ${APPLE_KEY_ID:ABCD123456}
  key-path: ${APPLE_KEY_PATH:/path/to/apple/key.p8}
  bundle-id: ${APPLE_BUNDLE_ID:com.travolish}

# SMS configuration
sms:
  enabled: ${SMS_ENABLED:false}
  provider: ${SMS_PROVIDER:mock}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}

server:
  port: 8080
  error:
    include-message: always
    include-exception: true
    include-stacktrace: on_param

logging:
  level:
    com.travolish.traveller.notifications: INFO

# ── Test data ────────────────────────────────────────────────────────────────
# Set to true to seed admin test data on startup (users, hotels, KYC,
# reviews, bookings, pricing rules). Skips automatically if already seeded.
# Catalog items are always seeded by CatalogDataInitializer regardless of this flag.
app:
  init-test-data: false
