spring:
  application:
    name: traveller-service
  datasource:
    # PostgreSQL database connection to Supabase
    url: ${DB_URL:jdbc:postgresql://db.hizprgnbtsomiucqwull.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:#Orion2026*}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1011344852484-ptc8n4lcmig0k9tmnfsp6bumngeh3e2d.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - openid
              - profile
              - email
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
          facebook:
            client-id: ${FACEBOOK_APP_ID:}
            client-secret: ${FACEBOOK_APP_SECRET:}
            scope:
              - email
              - public_profile
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
          apple:
            client-id: ${APPLE_CLIENT_ID:com.travolish.app}
            client-secret: ${APPLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/oauth/authorize
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v18.0/me?fields=id,first_name,last_name,email,picture.type(large)
            user-name-attribute: id
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://api.appleid.apple.com/auth/access_token
            user-name-attribute: sub
  s3:
    bucket: ${S3_BUCKET:travolish-bucket}
    region: ${AWS_REGION:us-east-1}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@travolish.com}
    from-name: ${MAIL_FROM_NAME:Travolish Hotels}
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: notification-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s

# Supabase Storage configuration (replaces S3)
supabase:
  url: ${SUPABASE_URL:https://hizprgnbtsomiucqwull.supabase.co}
  api-key: ${SUPABASE_API_KEY:your-anon-key}
  bucket-name: ${SUPABASE_BUCKET_NAME:travolish-bucket}

# Apple OAuth configuration (custom implementation)
apple:
  client-id: ${APPLE_CLIENT_ID:com.travolish.app}
  team-id: ${APPLE_TEAM_ID:ABCD123456}
  key-id: ${APPLE_KEY_ID:ABCD123456}
  key-path: ${APPLE_KEY_PATH:/path/to/apple/key.p8}
  bundle-id: ${APPLE_BUNDLE_ID:com.travolish}

# SMS configuration (for Twilio or similar providers)
sms:
  enabled: ${SMS_ENABLED:false}
  provider: ${SMS_PROVIDER:mock} # Options: mock, twilio, aws-sns
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}

# Springdoc (Swagger) UI will be available at /swagger-ui.html or /swagger-ui/index.html
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.travolish.traveller.notifications: INFO
